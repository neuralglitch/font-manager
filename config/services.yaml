services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Providers
    NeuralGlitch\FontManager\Provider\GoogleFontsProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.google%'

    NeuralGlitch\FontManager\Provider\BunnyFontsProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.bunny%'

    NeuralGlitch\FontManager\Provider\FontsourceProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.fontsource%'

    NeuralGlitch\FontManager\Provider\LocalFontsProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.local%'

    # Provider Registry
    NeuralGlitch\FontManager\Provider\ProviderRegistry:
        arguments:
            $defaultProvider: '%font_manager.default_provider%'
        calls:
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\GoogleFontsProvider']
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\BunnyFontsProvider']
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\FontsourceProvider']
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\LocalFontsProvider']

    # Services
    NeuralGlitch\FontManager\Service\FontDownloader:
        arguments:
            $fontsDir: '%font_manager.fonts_dir%'
            $httpClient: '@http_client'
            $providerRegistry: '@NeuralGlitch\FontManager\Provider\ProviderRegistry'
            $filesystem: '@filesystem'
            $unicodeSubsets: '%font_manager.unicode_subsets%'

    NeuralGlitch\FontManager\Service\FontLockManager:
        arguments:
            $manifestFile: '%font_manager.manifest_file%'
            $fontDownloader: '@NeuralGlitch\FontManager\Service\FontDownloader'
            $filesystem: '@filesystem'

    # Twig Extension
    NeuralGlitch\FontManager\Twig\FontManagerExtension:
        tags: ['twig.extension']

    NeuralGlitch\FontManager\Twig\FontManagerRuntime:
        arguments:
            $providerRegistry: '@NeuralGlitch\FontManager\Provider\ProviderRegistry'
            $useLockedFonts: '%font_manager.use_locked_fonts%'
            $manifestFile: '%font_manager.manifest_file%'
            $filesystem: '@filesystem'
        tags: ['twig.runtime']

    # Commands (explicit configuration for string parameters)
    NeuralGlitch\FontManager\Command\FontsLockCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $params: '@parameter_bag'
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsStatusCommand:
        arguments:
            $manifestFile: '%font_manager.manifest_file%'
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsPruneCommand:
        arguments:
            $manifestFile: '%font_manager.manifest_file%'
            $fontsDir: '%font_manager.fonts_dir%'
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\MigrateFromGoogleFontsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: ['console.command']

    # Commands with only service dependencies (autowired)
    NeuralGlitch\FontManager\Command\FontsSearchCommand:
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsValidateCommand:
        tags: ['console.command']

    # Exporters - CSS
    NeuralGlitch\FontManager\Exporter\Css\CssVariablesExporter: ~
    NeuralGlitch\FontManager\Exporter\Css\CssModulesExporter: ~
    NeuralGlitch\FontManager\Exporter\Css\CssLayerExporter: ~

    # Exporters - SCSS
    NeuralGlitch\FontManager\Exporter\Scss\ScssVariablesExporter: ~
    NeuralGlitch\FontManager\Exporter\Scss\ScssBootstrapExporter: ~
    NeuralGlitch\FontManager\Exporter\Scss\ScssMixinsExporter: ~

    # Exporters - JavaScript
    NeuralGlitch\FontManager\Exporter\JavaScript\EsmExporter: ~
    NeuralGlitch\FontManager\Exporter\JavaScript\TailwindConfigExporter: ~
    NeuralGlitch\FontManager\Exporter\JavaScript\TypeScriptExporter: ~

    # Exporters - Design System
    NeuralGlitch\FontManager\Exporter\DesignSystem\JsonExporter: ~
    NeuralGlitch\FontManager\Exporter\DesignSystem\DesignTokensExporter: ~
    NeuralGlitch\FontManager\Exporter\DesignSystem\FigmaTokensExporter: ~
    NeuralGlitch\FontManager\Exporter\DesignSystem\StyleDictionaryExporter: ~

    # Exporter Registry
    NeuralGlitch\FontManager\Exporter\ExporterRegistry:
        calls:
            - register: ['@NeuralGlitch\FontManager\Exporter\Css\CssVariablesExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\Css\CssModulesExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\Css\CssLayerExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\Scss\ScssVariablesExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\Scss\ScssBootstrapExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\Scss\ScssMixinsExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\JavaScript\EsmExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\JavaScript\TailwindConfigExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\JavaScript\TypeScriptExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\DesignSystem\JsonExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\DesignSystem\DesignTokensExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\DesignSystem\FigmaTokensExporter']
            - register: ['@NeuralGlitch\FontManager\Exporter\DesignSystem\StyleDictionaryExporter']

    # Build Tool Detection & Orchestration
    NeuralGlitch\FontManager\Service\BuildToolDetector: ~

    NeuralGlitch\FontManager\Service\ExporterOrchestrator:
        arguments:
            $registry: '@NeuralGlitch\FontManager\Exporter\ExporterRegistry'
            $filesystem: '@filesystem'

    # New Export Commands
    NeuralGlitch\FontManager\Command\FontsExportCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsFormatsCommand:
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsFormatInfoCommand:
        tags: ['console.command']

