services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Providers
    NeuralGlitch\FontManager\Provider\GoogleFontsProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.google%'

    NeuralGlitch\FontManager\Provider\BunnyFontsProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.bunny%'

    NeuralGlitch\FontManager\Provider\FontsourceProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.fontsource%'

    NeuralGlitch\FontManager\Provider\LocalFontsProvider:
        arguments:
            $httpClient: '@http_client'
            $config: '%font_manager.providers.local%'

    # Provider Registry
    NeuralGlitch\FontManager\Provider\ProviderRegistry:
        arguments:
            $defaultProvider: '%font_manager.default_provider%'
        calls:
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\GoogleFontsProvider']
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\BunnyFontsProvider']
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\FontsourceProvider']
            - registerProvider: ['@NeuralGlitch\FontManager\Provider\LocalFontsProvider']

    # Services
    NeuralGlitch\FontManager\Service\FontDownloader:
        arguments:
            $fontsDir: '%font_manager.fonts_dir%'
            $httpClient: '@http_client'
            $providerRegistry: '@NeuralGlitch\FontManager\Provider\ProviderRegistry'
            $filesystem: '@filesystem'
            $unicodeSubsets: '%font_manager.unicode_subsets%'

    NeuralGlitch\FontManager\Service\FontLockManager:
        arguments:
            $manifestFile: '%font_manager.manifest_file%'
            $fontDownloader: '@NeuralGlitch\FontManager\Service\FontDownloader'
            $filesystem: '@filesystem'

    # Twig Extension
    NeuralGlitch\FontManager\Twig\FontManagerExtension:
        tags: ['twig.extension']

    NeuralGlitch\FontManager\Twig\FontManagerRuntime:
        arguments:
            $providerRegistry: '@NeuralGlitch\FontManager\Provider\ProviderRegistry'
            $useLockedFonts: '%font_manager.use_locked_fonts%'
            $manifestFile: '%font_manager.manifest_file%'
            $filesystem: '@filesystem'
        tags: ['twig.runtime']

    # Commands (explicit configuration for string parameters)
    NeuralGlitch\FontManager\Command\FontsLockCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsStatusCommand:
        arguments:
            $manifestFile: '%font_manager.manifest_file%'
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsPruneCommand:
        arguments:
            $manifestFile: '%font_manager.manifest_file%'
            $fontsDir: '%font_manager.fonts_dir%'
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\MigrateFromGoogleFontsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: ['console.command']

    # Commands with only service dependencies (autowired)
    NeuralGlitch\FontManager\Command\FontsSearchCommand:
        tags: ['console.command']

    NeuralGlitch\FontManager\Command\FontsValidateCommand:
        tags: ['console.command']

