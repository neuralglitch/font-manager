font_manager:
    # Default provider: google, bunny, fontsource or local
    default_provider: bunny

    # Unicode subsets to include (reduces file count)
    unicode_subsets: [ 'latin', 'latin-ext' ]  # Default

    # Cache TTL for API responses (seconds)
    cache_ttl: 3600

    # Use locked fonts instead of CDN (automatically enabled in prod)
    use_locked_fonts: false

    # Directory for locked fonts
    fonts_dir: '%kernel.project_dir%/assets/fonts'

    # Font lock manifest file
    manifest_file: '%kernel.project_dir%/var/font-manager.lock.json'

    # Build tool configuration
    build:
        tool: 'auto'  # auto-detect: assetmapper, webpack, or vite

    # Export formats (generated when locking fonts)
    export:
        formats:
            - css_variables  # CSS custom properties (default)
            # Uncomment formats you need:
            # - scss_bootstrap     # Bootstrap SCSS variables
            # - tailwind_config    # Tailwind CSS configuration
            # - typescript_definitions  # TypeScript type definitions
            # - esm_javascript     # ES Modules
            # - scss_variables     # SCSS variables
            # - scss_mixins        # SCSS mixins & functions
            # - css_modules        # CSS Modules export
            # - css_layer          # CSS @layer integration
            # - json               # Generic JSON
            # - design_tokens      # W3C Design Tokens
            # - figma_tokens       # Figma Tokens Studio
            # - style_dictionary   # Style Dictionary format

    # Provider configurations
    providers:
        google:
            enabled: true
            api_key: null  # Optional, only for search command

        bunny:
            enabled: true  # Privacy-friendly, GDPR compliant

        fontsource:
            enabled: true  # Self-hosted via CDN (jsdelivr), version-controlled

        local:
            enabled: false
            directory: '%kernel.project_dir%/assets/fonts/custom'
            fonts: {}

# Production configuration
when@prod:
    font_manager:
        # Use locked/local fonts instead of CDN in production
        use_locked_fonts: true